<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 SoundCloud Neon Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ====== RESET & BASE ====== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: #0a0015;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ====== UNIVERSE NEON BACKGROUND ====== */
        .universe-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .universe-bg canvas {
            width: 100%; height: 100%;
        }

        /* Nebula gradient overlays */
        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
            animation: nebulaPulse 8s ease-in-out infinite alternate;
            z-index: 0;
        }
        .nebula-1 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #7b2ff7, #c471ed, transparent);
            top: -10%; left: -10%;
            animation-delay: 0s;
        }
        .nebula-2 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #00d2ff, #3a7bd5, transparent);
            bottom: -10%; right: -10%;
            animation-delay: 3s;
        }
        .nebula-3 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #f953c6, #b91d73, transparent);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 5s;
        }
        .nebula-4 {
            width: 350px; height: 350px;
            background: radial-gradient(circle, #00f5a0, #00d9f5, transparent);
            top: 20%; right: 20%;
            animation-delay: 2s;
        }

        @keyframes nebulaPulse {
            0% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(1.15); }
            100% { opacity: 0.25; transform: scale(1.05); }
        }

        /* ====== MAIN CONTAINER ====== */
        .main-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
        }

        /* ====== HEADER / INPUT SECTION ====== */
        .header {
            text-align: center;
            padding: 30px 0 20px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #c471ed, #00d2ff, #f953c6);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease infinite;
            margin-bottom: 8px;
            text-shadow: 0 0 40px rgba(196,113,237,0.3);
        }

        .header p {
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
            font-weight: 300;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .input-section {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 20px 0 30px;
            flex-wrap: wrap;
        }

        .input-section input {
            flex: 1;
            min-width: 300px;
            max-width: 600px;
            padding: 14px 20px;
            border: 2px solid rgba(196,113,237,0.3);
            border-radius: 50px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-section input::placeholder {
            color: rgba(255,255,255,0.35);
        }

        .input-section input:focus {
            border-color: #c471ed;
            box-shadow: 0 0 25px rgba(196,113,237,0.25);
            background: rgba(255,255,255,0.08);
        }

        .btn-load {
            padding: 14px 32px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #7b2ff7, #c471ed);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn-load:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(123,47,247,0.4);
        }

        .btn-load:active {
            transform: translateY(0);
        }

        /* ====== PLAYER LAYOUT ====== */
        .player-layout {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* ====== PLAYER CARD ====== */
        .player-card {
            width: 380px;
            background: rgba(30, 20, 50, 0.75);
            backdrop-filter: blur(40px);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(196,113,237,0.15);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 80px rgba(123,47,247,0.08);
            flex-shrink: 0;
        }

        /* Album Art */
        .artwork-container {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 24px;
            background: rgba(255,255,255,0.05);
            position: relative;
        }

        .artwork-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .artwork-container .placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(123,47,247,0.2), rgba(196,113,237,0.1));
        }

        .artwork-container .placeholder svg {
            width: 80px;
            height: 80px;
            opacity: 0.3;
        }

        /* Vinyl animation overlay */
        .vinyl-glow {
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: radial-gradient(circle at center, transparent 60%, rgba(123,47,247,0.1) 100%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .player-card.playing .vinyl-glow {
            opacity: 1;
            animation: vinylPulse 2s ease-in-out infinite;
        }

        @keyframes vinylPulse {
            0%, 100% { box-shadow: inset 0 0 30px rgba(196,113,237,0.1); }
            50% { box-shadow: inset 0 0 50px rgba(196,113,237,0.25); }
        }

        /* Track Info */
        .track-info {
            text-align: center;
            margin-bottom: 20px;
        }

        .track-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }

        .track-artist {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.5);
            font-weight: 300;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Progress Bar */
        .progress-section {
            margin-bottom: 20px;
        }

        .progress-bar-container {
            width: 100%;
            height: 5px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            margin-bottom: 8px;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #7b2ff7, #c471ed);
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s linear;
            position: relative;
        }

        .progress-bar-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(196,113,237,0.5);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .progress-bar-container:hover .progress-bar-fill::after {
            opacity: 1;
        }

        .progress-times {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            font-weight: 300;
        }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(255,255,255,0.6);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }

        .ctrl-btn:hover {
            color: #fff;
            transform: scale(1.1);
        }

        .ctrl-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .ctrl-btn.liked {
            color: #f953c6;
        }

        .btn-play-pause {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e8e0f0, #fff);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .btn-play-pause svg {
            width: 24px;
            height: 24px;
            fill: #1a1a2e;
        }

        .btn-play-pause:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 30px rgba(196,113,237,0.3);
        }

        /* Volume */
        .volume-section {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .volume-section svg {
            width: 18px;
            height: 18px;
            fill: rgba(255,255,255,0.4);
            flex-shrink: 0;
        }

        .volume-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c471ed, #7b2ff7);
            cursor: pointer;
            box-shadow: 0 0 8px rgba(196,113,237,0.4);
        }

        /* ====== PLAYLIST PANEL ====== */
        .playlist-panel {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 15px;
        }

        .playlist-panel::-webkit-scrollbar {
            width: 4px;
        }
        .playlist-panel::-webkit-scrollbar-thumb {
            background: rgba(196,113,237,0.3);
            border-radius: 4px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.82rem;
        }

        .playlist-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .playlist-item.active {
            background: rgba(123,47,247,0.15);
        }

        .playlist-item .pl-num {
            color: rgba(255,255,255,0.3);
            font-size: 0.75rem;
            min-width: 20px;
        }

        .playlist-item .pl-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: rgba(255,255,255,0.7);
        }

        .playlist-item.active .pl-title {
            color: #c471ed;
        }

        .playlist-item .pl-duration {
            color: rgba(255,255,255,0.3);
            font-size: 0.75rem;
        }

        /* ====== LYRICS PANEL ====== */
        .lyrics-card {
            flex: 1;
            min-width: 320px;
            max-width: 480px;
            max-height: 680px;
            background: rgba(30, 20, 50, 0.75);
            backdrop-filter: blur(40px);
            border-radius: 24px;
            border: 1px solid rgba(196,113,237,0.15);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 80px rgba(123,47,247,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .lyrics-header {
            padding: 24px 28px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .lyrics-header svg {
            width: 22px;
            height: 22px;
            fill: #c471ed;
        }

        .lyrics-header h3 {
            font-size: 1rem;
            font-weight: 600;
            background: linear-gradient(135deg, #c471ed, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .lyrics-search {
            padding: 12px 24px;
            display: flex;
            gap: 8px;
        }

        .lyrics-search input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            outline: none;
        }

        .lyrics-search input:focus {
            border-color: rgba(196,113,237,0.4);
        }

        .lyrics-search button {
            padding: 10px 18px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #7b2ff7, #c471ed);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lyrics-search button:hover {
            box-shadow: 0 4px 15px rgba(123,47,247,0.4);
        }

        .lyrics-content {
            flex: 1;
            padding: 20px 28px;
            overflow-y: auto;
            line-height: 2;
            font-size: 0.95rem;
            color: rgba(255,255,255,0.55);
        }

        .lyrics-content::-webkit-scrollbar {
            width: 4px;
        }
        .lyrics-content::-webkit-scrollbar-thumb {
            background: rgba(196,113,237,0.3);
            border-radius: 4px;
        }

        .lyrics-content .lyrics-line {
            padding: 4px 12px;
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: default;
        }

        .lyrics-content .lyrics-line:hover {
            color: rgba(255,255,255,0.8);
            background: rgba(255,255,255,0.03);
        }

        .lyrics-content .lyrics-line.active {
            color: #fff;
            font-weight: 500;
            background: rgba(123,47,247,0.12);
            text-shadow: 0 0 20px rgba(196,113,237,0.3);
        }

        .lyrics-content .lyrics-empty {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255,255,255,0.25);
        }

        .lyrics-content .lyrics-empty svg {
            width: 60px;
            height: 60px;
            fill: rgba(255,255,255,0.1);
            margin-bottom: 16px;
        }

        .lyrics-content .lyrics-empty p {
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .lyrics-content .lyrics-empty small {
            font-size: 0.78rem;
            color: rgba(255,255,255,0.15);
        }

        .lyrics-source {
            padding: 12px 28px;
            text-align: center;
            font-size: 0.72rem;
            color: rgba(255,255,255,0.2);
            border-top: 1px solid rgba(255,255,255,0.04);
        }

        /* ====== HIDDEN SC IFRAME ====== */
        .sc-widget-wrapper {
            position: fixed;
            bottom: -1000px;
            left: -1000px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        /* ====== LOADING SPINNER ====== */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10,0,21,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            backdrop-filter: blur(10px);
        }

        .loading-overlay.show {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(196,113,237,0.2);
            border-top: 3px solid #c471ed;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ====== TOAST NOTIFICATION ====== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(30,20,50,0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(196,113,237,0.3);
            padding: 12px 24px;
            border-radius: 14px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.8);
            z-index: 1000;
            transition: transform 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* ====== RESPONSIVE ====== */
        @media (max-width: 860px) {
            .player-layout {
                flex-direction: column;
                align-items: center;
            }
            .player-card { width: 100%; max-width: 400px; }
            .lyrics-card { max-width: 400px; width: 100%; max-height: 500px; }
            .header h1 { font-size: 1.6rem; }
        }

        @media (max-width: 480px) {
            .player-card { padding: 20px; }
            .input-section input { min-width: 200px; }
        }
    </style>
</head>
<body>

    <!-- ====== UNIVERSE BACKGROUND ====== -->
    <div class="universe-bg">
        <canvas id="starsCanvas"></canvas>
    </div>
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>
    <div class="nebula nebula-4"></div>

    <!-- ====== LOADING ====== -->
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
    </div>

    <!-- ====== TOAST ====== -->
    <div class="toast" id="toast"></div>

    <!-- ====== MAIN ====== -->
    <div class="main-container">
        <div class="header">
            <h1>🌌 SoundCloud Neon Player</h1>
            <p>Dán link playlist hoặc track từ SoundCloud để thưởng thức âm nhạc</p>
        </div>

        <div class="input-section">
            <input type="text" id="scUrl" placeholder="🔗 Dán link SoundCloud tại đây... (track hoặc playlist)" />
            <button class="btn-load" id="btnLoad" onclick="loadSoundCloud()">
                ▶ Phát nhạc
            </button>
        </div>

        <div class="player-layout">
            <!-- ====== PLAYER CARD ====== -->
            <div class="player-card" id="playerCard">
                <div class="artwork-container" id="artworkContainer">
                    <div class="placeholder" id="artworkPlaceholder">
                        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" fill="rgba(255,255,255,0.2)"/></svg>
                    </div>
                    <img id="artwork" src="" alt="" style="display:none;" />
                    <div class="vinyl-glow"></div>
                </div>

                <div class="track-info">
                    <div class="track-title" id="trackTitle">Chưa có bài hát</div>
                    <div class="track-artist" id="trackArtist">Dán link SoundCloud để bắt đầu</div>
                </div>

                <div class="progress-section">
                    <div class="progress-bar-container" id="progressBar" onclick="seekTrack(event)">
                        <div class="progress-bar-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-times">
                        <span id="currentTime">0:00</span>
                        <span id="totalTime">0:00</span>
                    </div>
                </div>

                <div class="controls">
                    <button class="ctrl-btn" id="btnLike" onclick="toggleLike()">
                        <svg viewBox="0 0 24 24"><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></svg>
                    </button>
                    <button class="ctrl-btn" onclick="prevTrack()">
                        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button class="btn-play-pause" id="btnPlayPause" onclick="togglePlay()">
                        <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="iconPause" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button class="ctrl-btn" onclick="nextTrack()">
                        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                    <button class="ctrl-btn" id="btnShuffle" onclick="toggleShuffle()">
                        <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                    </button>
                </div>

                <div class="volume-section">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80" oninput="changeVolume(this.value)" />
                </div>

                <!-- Playlist inside player card -->
                <div class="playlist-panel" id="playlistPanel" style="display:none;"></div>
            </div>

            <!-- ====== LYRICS CARD ====== -->
            <div class="lyrics-card">
                <div class="lyrics-header">
                    <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                    <h3>Lời bài hát</h3>
                </div>
                <div class="lyrics-search">
                    <input type="text" id="lyricsSearchInput" placeholder="Tìm lyrics (tên bài + ca sĩ)..." />
                    <button onclick="manualSearchLyrics()">Tìm</button>
                </div>
                <div class="lyrics-content" id="lyricsContent">
                    <div class="lyrics-empty">
                        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                        <p>Chưa có lời bài hát</p>
                        <small>Lyrics sẽ tự động tải khi phát nhạc</small>
                    </div>
                </div>
                <div class="lyrics-source" id="lyricsSource">
                    Powered by lyrics.ovh API
                </div>
            </div>
        </div>
    </div>

    <!-- ====== HIDDEN SOUNDCLOUD IFRAME ====== -->
    <div class="sc-widget-wrapper">
        <iframe id="scIframe"
            width="100%" height="166"
            scrolling="no" frameborder="no" allow="autoplay"
            src="">
        </iframe>
    </div>

    <!-- SoundCloud Widget API -->
    <script src="https://w.soundcloud.com/player/api.js"></script>

    <script>
        // ====== STATE ======
        let widget = null;
        let isPlaying = false;
        let isLiked = false;
        let isShuffled = false;
        let currentTrackInfo = { title: '', artist: '', duration: 0 };
        let playlistTracks = [];
        let currentTrackIndex = 0;
        let progressInterval = null;

        // ====== STARS BACKGROUND ======
        const canvas = document.getElementById('starsCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let shootingStars = [];

        function initStars() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            const count = Math.min(Math.floor(canvas.width * canvas.height / 2000), 500);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.8 + 0.3,
                    alpha: Math.random(),
                    alphaSpeed: Math.random() * 0.015 + 0.003,
                    color: ['#fff', '#c471ed', '#00d2ff', '#f953c6', '#00f5a0'][Math.floor(Math.random() * 5)]
                });
            }
        }

        function addShootingStar() {
            if (Math.random() < 0.003) {
                shootingStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 0.5,
                    length: Math.random() * 80 + 50,
                    speed: Math.random() * 8 + 6,
                    angle: Math.PI / 4 + Math.random() * 0.3,
                    alpha: 1,
                    life: 0
                });
            }
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw stars
            for (const s of stars) {
                s.alpha += s.alphaSpeed;
                if (s.alpha >= 1 || s.alpha <= 0.1) s.alphaSpeed *= -1;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = s.color;
                ctx.globalAlpha = Math.max(0.1, s.alpha);
                ctx.fill();
            }

            // Shooting stars
            addShootingStar();
            ctx.globalAlpha = 1;
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const ss = shootingStars[i];
                ss.life++;
                ss.x += Math.cos(ss.angle) * ss.speed;
                ss.y += Math.sin(ss.angle) * ss.speed;
                ss.alpha -= 0.015;

                if (ss.alpha <= 0) {
                    shootingStars.splice(i, 1);
                    continue;
                }

                const gradient = ctx.createLinearGradient(
                    ss.x, ss.y,
                    ss.x - Math.cos(ss.angle) * ss.length,
                    ss.y - Math.sin(ss.angle) * ss.length
                );
                gradient.addColorStop(0, `rgba(255,255,255,${ss.alpha})`);
                gradient.addColorStop(0.4, `rgba(196,113,237,${ss.alpha * 0.6})`);
                gradient.addColorStop(1, 'rgba(196,113,237,0)');

                ctx.beginPath();
                ctx.moveTo(ss.x, ss.y);
                ctx.lineTo(
                    ss.x - Math.cos(ss.angle) * ss.length,
                    ss.y - Math.sin(ss.angle) * ss.length
                );
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            ctx.globalAlpha = 1;
            requestAnimationFrame(animateStars);
        }

        window.addEventListener('resize', initStars);
        initStars();
        animateStars();

        // ====== SOUNDCLOUD INTEGRATION ======
        function loadSoundCloud() {
            const url = document.getElementById('scUrl').value.trim();
            if (!url) {
                showToast('⚠️ Vui lòng dán link SoundCloud!');
                return;
            }

            if (!url.includes('soundcloud.com')) {
                showToast('⚠️ Link không hợp lệ! Vui lòng dán link SoundCloud.');
                return;
            }

            showLoading(true);

            const iframe = document.getElementById('scIframe');
            const embedUrl = `https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&color=%237b2ff7&auto_play=true&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false`;
            iframe.src = embedUrl;

            // Wait for iframe to load then init widget
            setTimeout(() => {
                initWidget();
            }, 1500);
        }

        function initWidget() {
            const iframe = document.getElementById('scIframe');
            widget = SC.Widget(iframe);

            widget.bind(SC.Widget.Events.READY, () => {
                showLoading(false);
                showToast('✅ Đã tải thành công!');

                widget.setVolume(document.getElementById('volumeSlider').value);

                // Get track info
                loadCurrentTrackInfo();

                // Load playlist tracks
                widget.getSounds((sounds) => {
                    if (sounds && sounds.length > 1) {
                        playlistTracks = sounds;
                        renderPlaylist();
                    }
                });

                widget.play();
                setPlayingState(true);
            });

            widget.bind(SC.Widget.Events.PLAY, () => {
                setPlayingState(true);
                loadCurrentTrackInfo();
            });

            widget.bind(SC.Widget.Events.PAUSE, () => {
                setPlayingState(false);
            });

            widget.bind(SC.Widget.Events.FINISH, () => {
                setPlayingState(false);
            });

            widget.bind(SC.Widget.Events.PLAY_PROGRESS, (data) => {
                updateProgress(data.currentPosition, currentTrackInfo.duration);
            });
        }

        function loadCurrentTrackInfo() {
            if (!widget) return;
            widget.getCurrentSound((track) => {
                if (!track) return;

                // Parse title and artist
                let title = track.title || 'Unknown';
                let artist = track.user ? track.user.username : 'Unknown Artist';

                // Try to split "Artist - Title" format
                if (title.includes(' - ')) {
                    const parts = title.split(' - ');
                    artist = parts[0].trim();
                    title = parts.slice(1).join(' - ').trim();
                } else if (title.includes(' – ')) {
                    const parts = title.split(' – ');
                    artist = parts[0].trim();
                    title = parts.slice(1).join(' – ').trim();
                }

                // Clean up title - remove things in brackets/parentheses that are tags
                const cleanTitle = title
                    .replace(/\[.*?\]/g, '')
                    .replace(/\(Official.*?\)/gi, '')
                    .replace(/\(Lyric.*?\)/gi, '')
                    .replace(/\(Audio.*?\)/gi, '')
                    .replace(/\(Music Video.*?\)/gi, '')
                    .replace(/\(Visualizer.*?\)/gi, '')
                    .trim();

                currentTrackInfo = {
                    title: title,
                    artist: artist,
                    cleanTitle: cleanTitle || title,
                    duration: track.duration || 0,
                    artworkUrl: track.artwork_url ? track.artwork_url.replace('-large', '-t500x500') : null
                };

                // Update UI
                document.getElementById('trackTitle').textContent = title;
                document.getElementById('trackArtist').textContent = artist;
                document.getElementById('totalTime').textContent = formatTime(track.duration);

                // Update artwork
                if (currentTrackInfo.artworkUrl) {
                    const img = document.getElementById('artwork');
                    img.src = currentTrackInfo.artworkUrl;
                    img.style.display = 'block';
                    document.getElementById('artworkPlaceholder').style.display = 'none';
                } else {
                    document.getElementById('artwork').style.display = 'none';
                    document.getElementById('artworkPlaceholder').style.display = 'flex';
                }

                // Update lyrics search input
                document.getElementById('lyricsSearchInput').value = `${currentTrackInfo.cleanTitle} ${artist}`;

                // Auto fetch lyrics
                fetchLyrics(currentTrackInfo.cleanTitle, artist);

                // Update active playlist item
                widget.getCurrentSoundIndex((index) => {
                    currentTrackIndex = index;
                    updatePlaylistActive(index);
                });
            });
        }

        function renderPlaylist() {
            const panel = document.getElementById('playlistPanel');
            if (playlistTracks.length <= 1) {
                panel.style.display = 'none';
                return;
            }
            panel.style.display = 'block';
            panel.innerHTML = playlistTracks.map((track, i) => {
                const title = track.title || 'Unknown';
                const duration = formatTime(track.duration);
                return `<div class="playlist-item ${i === currentTrackIndex ? 'active' : ''}" onclick="skipTo(${i})">
                    <span class="pl-num">${i + 1}</span>
                    <span class="pl-title">${title}</span>
                    <span class="pl-duration">${duration}</span>
                </div>`;
            }).join('');
        }

        function updatePlaylistActive(index) {
            document.querySelectorAll('.playlist-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
        }

        function skipTo(index) {
            if (widget) {
                widget.skip(index);
                widget.play();
            }
        }

        // ====== PLAYER CONTROLS ======
        function togglePlay() {
            if (!widget) {
                showToast('⚠️ Hãy tải nhạc trước!');
                return;
            }
            widget.toggle();
        }

        function setPlayingState(playing) {
            isPlaying = playing;
            document.getElementById('iconPlay').style.display = playing ? 'none' : 'block';
            document.getElementById('iconPause').style.display = playing ? 'block' : 'none';
            document.getElementById('playerCard').classList.toggle('playing', playing);
        }

        function nextTrack() {
            if (!widget) return;
            widget.next();
        }

        function prevTrack() {
            if (!widget) return;
            widget.prev();
        }

        function toggleLike() {
            isLiked = !isLiked;
            const btn = document.getElementById('btnLike');
            btn.classList.toggle('liked', isLiked);
            if (isLiked) {
                btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
            } else {
                btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></svg>`;
            }
            showToast(isLiked ? '❤️ Đã thích!' : '💔 Bỏ thích');
        }

        function toggleShuffle() {
            isShuffled = !isShuffled;
            document.getElementById('btnShuffle').style.color = isShuffled ? '#c471ed' : '';
            showToast(isShuffled ? '🔀 Bật trộn bài' : '🔀 Tắt trộn bài');
        }

        function changeVolume(val) {
            if (widget) {
                widget.setVolume(parseInt(val));
            }
        }

        function seekTrack(event) {
            if (!widget || !currentTrackInfo.duration) return;
            const bar = document.getElementById('progressBar');
            const rect = bar.getBoundingClientRect();
            const percent = (event.clientX - rect.left) / rect.width;
            const seekMs = percent * currentTrackInfo.duration;
            widget.seekTo(seekMs);
        }

        function updateProgress(currentMs, totalMs) {
            if (!totalMs) return;
            const percent = (currentMs / totalMs) * 100;
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('currentTime').textContent = formatTime(currentMs);
        }

        function formatTime(ms) {
            const totalSec = Math.floor(ms / 1000);
            const min = Math.floor(totalSec / 60);
            const sec = totalSec % 60;
            return `${min}:${sec.toString().padStart(2, '0')}`;
        }

        // ====== LYRICS ======
        async function fetchLyrics(title, artist) {
            const lyricsEl = document.getElementById('lyricsContent');
            lyricsEl.innerHTML = `
                <div class="lyrics-empty">
                    <div class="spinner" style="margin: 0 auto 16px; width:30px; height:30px; border-width:2px;"></div>
                    <p>Đang tìm lời bài hát...</p>
                    <small>${title} - ${artist}</small>
                </div>
            `;

            // Clean title more aggressively for search
            const searchTitle = title
                .replace(/\(.*?\)/g, '')
                .replace(/\[.*?\]/g, '')
                .replace(/feat\..*$/i, '')
                .replace(/ft\..*$/i, '')
                .replace(/prod\..*$/i, '')
                .trim();

            const searchArtist = artist
                .replace(/\(.*?\)/g, '')
                .replace(/\[.*?\]/g, '')
                .trim();

            try {
                // Try lyrics.ovh API
                const response = await fetch(`https://api.lyrics.ovh/v1/${encodeURIComponent(searchArtist)}/${encodeURIComponent(searchTitle)}`);

                if (response.ok) {
                    const data = await response.json();
                    if (data.lyrics && data.lyrics.trim()) {
                        displayLyrics(data.lyrics);
                        document.getElementById('lyricsSource').textContent = `Lyrics source: lyrics.ovh | ${title} - ${artist}`;
                        return;
                    }
                }

                // If first attempt fails, try with original title
                if (searchTitle !== title) {
                    const response2 = await fetch(`https://api.lyrics.ovh/v1/${encodeURIComponent(searchArtist)}/${encodeURIComponent(title)}`);
                    if (response2.ok) {
                        const data2 = await response2.json();
                        if (data2.lyrics && data2.lyrics.trim()) {
                            displayLyrics(data2.lyrics);
                            document.getElementById('lyricsSource').textContent = `Lyrics source: lyrics.ovh | ${title} - ${artist}`;
                            return;
                        }
                    }
                }

                // No lyrics found
                lyricsEl.innerHTML = `
                    <div class="lyrics-empty">
                        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                        <p>Không tìm thấy lời bài hát</p>
                        <small>Thử tìm thủ công bằng ô tìm kiếm phía trên</small>
                    </div>
                `;
            } catch (err) {
                console.error('Lyrics fetch error:', err);
                lyricsEl.innerHTML = `
                    <div class="lyrics-empty">
                        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                        <p>Lỗi khi tải lyrics</p>
                        <small>Thử tìm thủ công bằng ô tìm kiếm phía trên</small>
                    </div>
                `;
            }
        }

        function displayLyrics(text) {
            const lyricsEl = document.getElementById('lyricsContent');
            const lines = text.split('\n');
            lyricsEl.innerHTML = lines.map((line, i) => {
                if (line.trim() === '') {
                    return `<div class="lyrics-line" style="height:16px;"></div>`;
                }
                return `<div class="lyrics-line" data-index="${i}">${line}</div>`;
            }).join('');

            // Scroll to top
            lyricsEl.scrollTop = 0;
        }

        function manualSearchLyrics() {
            const query = document.getElementById('lyricsSearchInput').value.trim();
            if (!query) {
                showToast('⚠️ Nhập tên bài hát và ca sĩ!');
                return;
            }

            // Try to parse "title artist" or "artist - title"
            let artist, title;
            if (query.includes(' - ')) {
                const parts = query.split(' - ');
                artist = parts[0].trim();
                title = parts.slice(1).join(' - ').trim();
            } else if (query.includes(' – ')) {
                const parts = query.split(' – ');
                artist = parts[0].trim();
                title = parts.slice(1).join(' – ').trim();
            } else {
                // Try splitting in half or use as title with empty artist
                const words = query.split(' ');
                if (words.length >= 2) {
                    // First word(s) as title, last as artist or vice versa
                    title = query;
                    artist = currentTrackInfo.artist || '';
                } else {
                    title = query;
                    artist = '';
                }
            }

            fetchLyrics(title, artist);
        }

        // Enter key support for inputs
        document.getElementById('scUrl').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') loadSoundCloud();
        });

        document.getElementById('lyricsSearchInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') manualSearchLyrics();
        });

        // ====== UTILITIES ======
        function showLoading(show) {
            document.getElementById('loading').classList.toggle('show', show);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ====== KEYBOARD SHORTCUTS ======
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            switch(e.code) {
                case 'Space':
                    e.preventDefault();
                    togglePlay();
                    break;
                case 'ArrowRight':
                    nextTrack();
                    break;
                case 'ArrowLeft':
                    prevTrack();
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    const volUp = Math.min(100, parseInt(document.getElementById('volumeSlider').value) + 10);
                    document.getElementById('volumeSlider').value = volUp;
                    changeVolume(volUp);
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    const volDown = Math.max(0, parseInt(document.getElementById('volumeSlider').value) - 10);
                    document.getElementById('volumeSlider').value = volDown;
                    changeVolume(volDown);
                    break;
            }
        });

        // ====== MEDIA SESSION API ======
        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', () => togglePlay());
            navigator.mediaSession.setActionHandler('pause', () => togglePlay());
            navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
            navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
        }
    </script>
</body>
</html>
